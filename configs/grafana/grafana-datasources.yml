apiVersion: 1
datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  editable: true
- name: Mimir
  type: prometheus
  access: proxy
  url: http://mimir-query-frontend:8080/prometheus
  editable: true
- name: Loki
  type: loki
  access: proxy
  url: http://loki:3100
  editable: true
# Note: Nest PostgreSQL datasource must be configured manually in Grafana UI
# after deployment, as the password is stored in configs/nest/.env
